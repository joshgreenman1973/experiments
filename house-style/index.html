<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House style — three directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#2a2a28;font-family:'IBM Plex Mono',monospace}
.strip{max-width:1180px;margin:0 auto;padding:28px 20px 70px}
.qhead{color:#c8c2b4;font-size:11px;letter-spacing:.22em;text-transform:uppercase;margin:34px 0 10px;
  display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
.qhead b{color:#fff;font-size:13px;letter-spacing:.14em}
.qhead span{font-size:10px;color:#8f8a7e;letter-spacing:.1em;text-transform:none}
.spec{border:1px solid #4a4a46;overflow:hidden}

/* ============ shared skeleton (all three use the same structure) ============ */
.sheet{position:relative}
.mast{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding:26px 30px 18px}
.issuer{font-size:9.5px;line-height:1.9;letter-spacing:.2em;text-transform:uppercase}
.issuer b{display:block;font-weight:600}
.titleblk{text-align:right}
h1{margin:0;line-height:.98}
.series{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;margin-top:8px;line-height:1.75}
.lede{padding:15px 30px;font-size:1.02rem;line-height:1.6;max-width:74ch;margin:0}
.margin{padding:10px 30px 12px;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  display:flex;flex-wrap:wrap;gap:4px 26px}
.margin b{font-weight:600}
.body{display:grid;grid-template-columns:1.1fr 1fr;gap:0}
@media(max-width:820px){.body{grid-template-columns:1fr}.mast{grid-template-columns:1fr}.titleblk{text-align:left}}
.col{padding:16px 30px 22px}
.colhead{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;padding-bottom:7px;margin-bottom:11px}
.rec{padding:9px 0;font-size:.95rem}
.rec .nm{display:block;font-size:1.05rem;line-height:1.25}
.rec .mt{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;margin-top:3px}
.tag{display:inline-block;padding:1px 6px;border:1px solid currentColor;margin-right:7px;font-size:9px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{font-size:9px;letter-spacing:.15em;text-transform:uppercase;text-align:left;padding:5px 8px 5px 0;font-weight:600}
td{padding:5px 8px 5px 0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:7px;display:block}

/* ============ A · BUREAU ============ */
#A{background:#efe7d7;color:#1c211c;font-family:'Newsreader',Georgia,serif}
#A .issuer,#A .series,#A .margin,#A .colhead,#A .rec .mt,#A th,#A .tag{font-family:'IBM Plex Mono',monospace;color:#5a5245}
#A .issuer b,#A .margin b{color:#1c211c}
#A h1{font-family:'Newsreader',serif;font-weight:500;font-size:clamp(2rem,5vw,3.4rem);
  letter-spacing:.04em;text-transform:uppercase}
#A .mast{border-bottom:1px solid #b9ab90}
#A .lede{border-bottom:1px solid #b9ab90}
#A .margin{border-bottom:1.5px solid #1c211c}
#A .col{border-right:1px solid #b9ab90}
#A .col:last-child{border-right:0}
#A .colhead{border-bottom:1px solid #1c211c}
#A .rec{border-bottom:1px solid #d5c8ab}
#A .rec .nm{font-weight:500}
#A th{border-bottom:1px solid #1c211c}
#A td{border-bottom:1px solid #d5c8ab}
#A .bar{background:#3f6b46}
#A .tag{color:#8a6234}

/* ============ B · PLATE ============ */
#B{background:#12130f;color:#e6e2d3;font-family:'Newsreader',Georgia,serif}
#B .issuer,#B .series,#B .margin,#B .colhead,#B .rec .mt,#B th,#B .tag{font-family:'IBM Plex Mono',monospace;color:#8d8a76}
#B .issuer b,#B .margin b{color:#e9dfae}
#B h1{font-family:'Newsreader',serif;font-weight:400;font-size:clamp(2.1rem,5.4vw,3.7rem);
  letter-spacing:.01em;font-style:italic;color:#f2ecd8;text-transform:none}
#B .mast{border-bottom:1px solid #34362b}
#B .lede{border-bottom:1px solid #34362b;color:#c9c5b4}
#B .margin{border-bottom:1px solid #6e7355}
#B .col{border-right:1px solid #34362b}
#B .col:last-child{border-right:0}
#B .colhead{border-bottom:1px solid #6e7355;color:#c3c88f}
#B .rec{border-bottom:1px solid #26281f}
#B th{border-bottom:1px solid #6e7355}
#B td{border-bottom:1px solid #26281f}
#B .bar{background:#c3c88f}
#B .tag{color:#d98a4a}

/* ============ C · LEDGER ============ */
#C{background:#f2f1ec;color:#16181d;font-family:'Archivo',system-ui,sans-serif}
#C .issuer,#C .series,#C .margin,#C .colhead,#C .rec .mt,#C th,#C .tag{font-family:'Space Mono',monospace;color:#5c626e}
#C .issuer b,#C .margin b{color:#16181d}
#C h1{font-family:'Archivo',sans-serif;font-weight:700;font-size:clamp(2rem,5.2vw,3.5rem);
  letter-spacing:-.035em;text-transform:none}
#C .mast{border-bottom:2px solid #16181d}
#C .lede{border-bottom:1px solid #cfd0cb}
#C .margin{background:#16181d;color:#b9bcc4}
#C .margin b{color:#fff}
#C .col{border-right:1px solid #cfd0cb}
#C .col:last-child{border-right:0}
#C .colhead{border-bottom:2px solid #16181d}
#C .rec{border-bottom:1px solid #ddded9}
#C .rec .nm{font-weight:600;letter-spacing:-.015em}
#C th{border-bottom:2px solid #16181d}
#C td{border-bottom:1px solid #ddded9}
#C .bar{background:#1c4f8f}
#C .tag{color:#1c4f8f}
</style>
</head>
<body>
<div class="strip">

<div class="qhead"><b>Direction A · Bureau</b>
  <span>Newsreader + IBM Plex Mono · paper stock varies per project, structure never does</span></div>
<div class="spec"><div class="sheet" id="A"></div></div>

<div class="qhead"><b>Direction B · Plate</b>
  <span>Same skeleton, night ground · for maps, sensors, anything live or nocturnal</span></div>
<div class="spec"><div class="sheet" id="B"></div></div>

<div class="qhead"><b>Direction C · Ledger</b>
  <span>Archivo + Space Mono · statistical-abstract density, numbers carry the page</span></div>
<div class="spec"><div class="sheet" id="C"></div></div>

</div>

<script>
const CONTENT = `
  <div class="mast">
    <div class="issuer">United States Department of the Interior<b>U.S. Board on Geographic Names</b>Domestic Names Committee</div>
    <div class="titleblk">
      <h1>Under Review</h1>
      <div class="series">United States &middot; Quarterly Review Series<br>Lists 450&ndash;464 &middot; February 6, 2023 to July 16, 2026</div>
    </div>
  </div>
  <p class="lede">The Board on Geographic Names decides the official name of every American stream, summit,
    lake and ridge. Anyone may file a proposal. Each becomes a case file stating who asked, what they want
    it called, where the feature is and the reason they gave.</p>
  <div class="margin">
    <span>Proposals on the docket <b>495</b></span>
    <span>States and territories <b>47</b></span>
    <span>Would change an existing name <b>147</b></span>
    <span>Names the Board calls offensive <b>51</b></span>
    <span>Review lists parsed <b>15</b></span>
  </div>
  <div class="body">
    <div class="col">
      <div class="colhead">Case files &mdash; 495</div>
      <div class="rec"><span class="nm">Heron Lake</span>
        <span class="mt"><span class="tag">New</span>Reservoir &middot; Kittitas County &middot; Washington</span></div>
      <div class="rec"><span class="nm">Gilbert Point</span>
        <span class="mt"><span class="tag">New</span>Cliff &middot; Coconino County &middot; Arizona</span></div>
      <div class="rec"><span class="nm">Stedman Pond &rarr; Hume Pond</span>
        <span class="mt"><span class="tag">Change</span>Lake &middot; Plymouth County &middot; Massachusetts</span></div>
      <div class="rec"><span class="nm">Mino-kwe Ponds &rarr; Mino-kwe Zaagigaanhs</span>
        <span class="mt"><span class="tag">Change</span>Lake &middot; Alger County &middot; Michigan</span></div>
    </div>
    <div class="col">
      <div class="colhead">Most-proposed feature types</div>
      <table>
        <tr><th>Feature</th><th style="width:44%"></th><th style="text-align:right">Count</th></tr>
        <tr><td>Stream</td><td><i class="bar" style="width:100%"></i></td><td class="n">181</td></tr>
        <tr><td>Summit</td><td><i class="bar" style="width:41%"></i></td><td class="n">75</td></tr>
        <tr><td>Lake</td><td><i class="bar" style="width:33%"></i></td><td class="n">60</td></tr>
        <tr><td>Reservoir</td><td><i class="bar" style="width:22%"></i></td><td class="n">40</td></tr>
        <tr><td>Island</td><td><i class="bar" style="width:12%"></i></td><td class="n">22</td></tr>
      </table>
    </div>
  </div>`;
['A','B','C'].forEach(id=>document.getElementById(id).innerHTML=CONTENT);
</script>
</body>
</html>
