name: Bus Tracker GTFS Refresh

# Weekly: rebuild route shapes, the route table and the scheduled-service file from
# the MTA's bus GTFS feeds. scheduled-service.json keeps every past date it already
# has, so each run only adds or updates today and later.
on:
  schedule:
    - cron: '20 7 * * 0'   # Sundays 07:20 UTC (3:20 a.m. ET in summer, 2:20 in winter)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gtfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build routes and scheduled service from GTFS
        env:
          GTFS_WORK_DIR: ${{ runner.temp }}/gtfs
        run: python3 nyc-bus-tracker/scripts/build_gtfs.py

      - name: Commit GTFS outputs to main
        run: |
          git config user.name "Bus Tracker Bot"
          git config user.email "bus-bot@users.noreply.github.com"
          git add nyc-bus-tracker/data/routes/ nyc-bus-tracker/data/gtfs/

          if git diff --staged --quiet; then
            echo "GTFS outputs unchanged"
            exit 0
          fi

          DATE=$(TZ='America/New_York' date '+%Y-%m-%d')
          git commit -m "Bus tracker: refresh GTFS routes and schedule (${DATE})"

          # Retry once on rejection in case another job pushed to main meanwhile.
          if ! git push origin main; then
            echo "Push rejected, rebasing and retrying..."
            git pull --rebase --autostash origin main
            git push origin main
          fi
