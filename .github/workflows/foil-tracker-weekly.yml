name: FOIL Tracker weekly update

on:
  schedule:
    - cron: '15 14 * * 1'  # 10:15 AM ET every Monday
  workflow_dispatch: {}

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    # Hard ceiling so a slow Akamai edge can never hang the job for hours again.
    # The scraper self-limits its detail pass to ~25m (DETAIL_TIME_BUDGET_MS),
    # leaving margin here for setup, list fetch, commit and push.
    timeout-minutes: 40
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: nyc-foil-tracker
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: nyc-foil-tracker
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        working-directory: nyc-foil-tracker
        run: node scrape.mjs --backfill
        env:
          CI: 'true'

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nyc-foil-tracker/data/
          if git diff --staged --quiet; then
            echo "No new data -- skipping commit"
          else
            git commit -m "FOIL Tracker update: $(date -u +%Y-%m-%d)"
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push origin main; then pushed=true; break; fi
              echo "Push rejected (attempt $attempt) — rebasing on latest main…"
              git pull --rebase --autostash origin main
            done
            $pushed || { echo "Push failed after retries"; exit 1; }
          fi

      - name: Open GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `FOIL Tracker weekly run failed (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              `The weekly FOIL Tracker run failed.`,
              ``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
              ``,
              `Check the logs above. If NYC Open Data (Socrata) is down, it'll recover on its own — just close this. If the detail-page scrape is persistently blocked, the list data still updates from Socrata, so this is non-urgent.`,
            ].join("\n");
            // Dedupe: don't spam — reuse an existing open issue with the same label
            const label = "foil-tracker-failure";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
