name: Collect Bus Data

# Hourly cron is reliable on GitHub Actions in a way "*/5" is not — short-interval
# crons get heavily throttled on free runners. Inside each hourly run we call
# collect.js 18 times with 30-second pauses, so we get dense 30-second samples
# (18 lines per hour × 17 operating hours = ~306 snapshots/day) without relying
# on cron precision. Public repos get unlimited Actions minutes, so cost is $0.
on:
  schedule:
    - cron: '0 10-23 * * *'  # 10:00-23:00 UTC (covers 6am-7pm ET in EDT, 5am-6pm ET in EST)
    - cron: '0 0-4 * * *'    # 00:00-04:00 UTC  (covers 8pm-12am ET in EDT, 7pm-11pm ET in EST)

  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'How many minutes of dense collection (default 9, max 50)'
        required: false
        default: '9'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # 18 iterations × ~50s each (30s sleep + 10-20s API+write at peak fleet) ~=
    # 15 min for the loop alone. Plus checkout, npm install, and push = ~17 min
    # at the high end. 20 min gives comfortable headroom; we hit the 15-min wall
    # on 2026-05-08 (runs cancelled at 11:07 ET and 13:19 ET).
    timeout-minutes: 20

    steps:
      - name: Operating-hours gate (6am-11pm ET)
        id: gate
        run: |
          HOUR_ET=$(TZ='America/New_York' date +%H)
          if [ "$HOUR_ET" -lt 6 ] || [ "$HOUR_ET" -ge 23 ]; then
            echo "Outside operating hours (${HOUR_ET}:00 ET). Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Within operating hours (${HOUR_ET}:00 ET). Proceeding."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # CODE lives on main (collect.js, package.json). DATA lives on bus-data
      # (so PR merges to main never collide with the bot's pushes). Strategy:
      # check out main as the working tree, then overlay snapshots from
      # bus-data into the data dir. Run the collector. Push only the snapshot
      # tree back to bus-data. main is read-only from the workflow's POV.
      - name: Checkout main (for collector code)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull latest snapshots from bus-data
        if: steps.gate.outputs.skip != 'true'
        run: |
          git fetch origin bus-data --depth=1
          # Replace working-tree snapshots with bus-data's version. Subsequent
          # collect.js calls append; we'll commit the diff directly to bus-data.
          rm -rf nyc-bus-tracker/data/snapshots
          git checkout origin/bus-data -- nyc-bus-tracker/data/snapshots/

      - name: Set up Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: cd nyc-bus-tracker/collector && npm ci

      - name: Collect bus data (dense sampling — 30 sec interval)
        if: steps.gate.outputs.skip != 'true'
        env:
          MTA_API_KEY: ${{ secrets.MTA_BUSTIME_API_KEY }}
          DURATION_MIN: ${{ github.event.inputs.duration_minutes || '9' }}
        run: |
          # Cap duration to 50 minutes so we always finish before the next hourly cron.
          DUR_MIN=${DURATION_MIN:-9}
          if [ "$DUR_MIN" -gt 50 ]; then DUR_MIN=50; fi
          # 30-second cadence -> 2 calls/minute. Iterations = duration * 2.
          ITERATIONS=$(( DUR_MIN * 2 ))
          echo "Running ${ITERATIONS} collections at 30-second intervals (~${DUR_MIN} min)"

          # We don't `set -e` because a single API blip shouldn't kill the run.
          OK=0
          FAIL=0
          for i in $(seq 1 $ITERATIONS); do
            if node nyc-bus-tracker/collector/collect.js; then
              OK=$((OK+1))
            else
              FAIL=$((FAIL+1))
              echo "::warning::collect.js failed on iteration ${i}"
            fi
            # Sleep on every iteration except the last
            if [ "$i" -lt "$ITERATIONS" ]; then
              sleep 30
            fi
          done
          echo "Collection complete: ${OK} succeeded, ${FAIL} failed."
          # Fail the run only if everything failed (partial loss is acceptable)
          if [ "$OK" -eq 0 ]; then exit 1; fi

      - name: Push new snapshots to bus-data
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "Bus Tracker Bot"
          git config user.email "bus-bot@users.noreply.github.com"

          # Build a fresh commit on top of bus-data with just the snapshot tree.
          # We're currently on main; switch to a detached bus-data state and
          # transfer ONLY data/snapshots/ from the working tree.
          git fetch origin bus-data --depth=1
          # Save the snapshots before switching branches (working tree changes).
          TMPSNAP=$(mktemp -d)
          cp -r nyc-bus-tracker/data/snapshots/* "$TMPSNAP/" 2>/dev/null || true

          git checkout -B bus-data origin/bus-data
          # Replace bus-data's snapshot tree with our updated copy.
          rm -rf nyc-bus-tracker/data/snapshots
          mkdir -p nyc-bus-tracker/data/snapshots
          cp -r "$TMPSNAP/." nyc-bus-tracker/data/snapshots/

          git add nyc-bus-tracker/data/snapshots/
          if git diff --staged --quiet; then
            echo "No new data to commit"
            exit 0
          fi

          DATE=$(TZ='America/New_York' date '+%Y-%m-%d %H:%M')
          git commit -m "Bus data: ${DATE} ET"

          # bus-data is bot-only, so non-fast-forward is rare. Retry once if
          # an overlapping run pushed in between.
          if ! git push origin bus-data; then
            echo "Push rejected, rebasing on bus-data and retrying..."
            git pull --rebase origin bus-data
            git push origin bus-data
          fi
