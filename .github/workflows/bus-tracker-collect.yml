name: Collect Bus Data

# ONE long-lived collector instead of 34 short cron runs a day.
#
# Until October 2026 this workflow fired at :09 and :39 every hour and each run
# collected a six-minute burst. GitHub's scheduler drops and delays cron runs,
# and from Oct. 1 it started only 3 to 5 of the 34 runs a day, so most hours
# went uncollected while every run that did start showed green.
#
# Now each run executes collector/loop.py, which stays up for about 5.5 hours,
# collects a burst at :09 and :39 past every hour from 6 a.m. to 10:59 p.m.
# Eastern, pushes each burst to bus-data, and then starts its own successor
# through workflow_dispatch (dispatch events are not subject to cron delays).
# The hourly cron below is only a backstop: when a collector is already live,
# the backstop run exits in seconds. Public repo, so Actions minutes are free.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      predecessor:
        description: 'Run id of the collector run that started this one (set automatically)'
        required: false
        default: ''
      once:
        description: 'Collect one burst now and exit, without starting a successor (for testing)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # Single writer. Exit before checkout if an older collector run is live.
      # The run that dispatched this one is exempt; wait for it to wind down.
      - name: Yield to a collector that is already running
        id: guard
        if: ${{ github.event.inputs.once != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ME: ${{ github.run_id }}
          PRED: ${{ github.event.inputs.predecessor }}
        run: |
          others() {
            gh api "repos/$REPO/actions/workflows/bus-tracker-collect.yml/runs?status=in_progress&per_page=50" \
              --jq "[.workflow_runs[].id | select(. != $ME) | tostring] | join(\" \")"
          }
          if [ -n "$PRED" ]; then
            for i in $(seq 1 20); do
              case " $(others) " in *" $PRED "*) sleep 15 ;; *) break ;; esac
            done
          fi
          for id in $(others); do
            if [ "$id" != "${PRED:-0}" ] && [ "$id" -lt "$ME" ]; then
              echo "Collector run $id is already live; this run yields."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout main (collector code)
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: nyc-bus-tracker/collector/package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: cd nyc-bus-tracker/collector && npm ci

      - name: Prepare the bus-data remote (blobless)
        if: steps.guard.outputs.skip != 'true'
        run: |
          # Blobless: commits and trees only. The multi-GB snapshot history is
          # never downloaded; the loop pulls just the current day's files.
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none

      - name: Collect
        if: steps.guard.outputs.skip != 'true'
        env:
          MTA_API_KEY: ${{ secrets.MTA_BUSTIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ONCE: ${{ github.event.inputs.once }}
        run: |
          if [ "$ONCE" = "true" ]; then
            python3 nyc-bus-tracker/collector/loop.py --once
          else
            python3 nyc-bus-tracker/collector/loop.py
          fi
