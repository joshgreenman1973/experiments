name: Process Daily Summary

on:
  # Run daily at 5:00 AM UTC (midnight ET during EDT, 12am EST)
  schedule:
    - cron: '0 5 * * *'

  # Manual trigger with optional date override
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD), defaults to yesterday'
        required: false

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      # Snapshots live on the `bus-data` branch (isolated from main so collection
      # never collides with PR pushes). Daily summaries land on `main` because
      # GitHub Pages serves from there. Strategy: check out main as the base,
      # then pull just data/snapshots/ from bus-data into the working tree.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull snapshot files from bus-data branch
        run: |
          git fetch origin bus-data --depth=1
          # Replace working-tree snapshots with the latest from bus-data.
          # We don't add them to the index — they stay on bus-data, not main.
          git checkout origin/bus-data -- nyc-bus-tracker/data/snapshots/
          echo "Snapshot files now in working tree:"
          ls nyc-bus-tracker/data/snapshots/ | tail -10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd nyc-bus-tracker/collector && npm ci

      - name: Process yesterday's snapshots
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='America/New_York' date -d 'yesterday' '+%Y-%m-%d' 2>/dev/null || TZ='America/New_York' date -v-1d '+%Y-%m-%d')
          fi
          echo "Processing date: $DATE"
          node nyc-bus-tracker/collector/process.js "$DATE"

      - name: Generate weekly/monthly rollups
        run: node nyc-bus-tracker/collector/rollup.js

      - name: Commit summaries to main
        run: |
          git config user.name "Bus Tracker Bot"
          git config user.email "bus-bot@users.noreply.github.com"
          # Only stage the rollup outputs. Snapshots stay on bus-data.
          git add nyc-bus-tracker/data/daily/ nyc-bus-tracker/data/summary/

          if git diff --staged --quiet; then
            echo "No new summaries to commit"
            exit 0
          fi

          DATE=$(TZ='America/New_York' date '+%Y-%m-%d')
          git commit -m "Daily summary: ${DATE}"

          # Daily processor runs at 1am ET when main is usually quiet, but
          # retry once on rejection just in case a PR landed mid-processing.
          if ! git push origin main; then
            echo "Push rejected, rebasing and retrying..."
            git pull --rebase --autostash origin main
            git add nyc-bus-tracker/data/daily/ nyc-bus-tracker/data/summary/
            git push origin main
          fi
