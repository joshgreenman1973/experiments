name: Process Daily Summary

# Turns raw snapshots on bus-data into data/daily/ and rebuilds every summary,
# route file, event list and download (scripts/rebuild.sh), then commits to main.
#
# Triggers: the collector loop dispatches this right after the first burst of
# each day (6:09 a.m. Eastern), so it doesn't wait on GitHub's cron, which ran
# 5 to 7 hours late in October 2026. The cron below is a backstop. Each run
# processes yesterday plus any day in the last two weeks that has snapshots but
# no current daily file, so a missed run heals itself.
#
# Ends red (after committing) when collection was thin on any of the last three
# days, so a collapse like Oct. 1-6, 2026, can't pass unnoticed again.
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Process only this date (YYYY-MM-DD); blank = yesterday plus any missing days'
        required: false

permissions:
  contents: write

concurrency:
  group: bus-tracker-process-daily
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Work out which days to process
        env:
          ONLY: ${{ github.event.inputs.date }}
        run: |
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git fetch --filter=blob:none --no-tags --depth=1 origin bus-data
          if [ -n "$ONLY" ]; then echo "$ONLY" > days.txt; else
            python3 - <<'PY' > days.txt
          import json, os, subprocess
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo('America/New_York')).date()
          on_branch = set(subprocess.run(['git', 'ls-tree', '--name-only', 'origin/bus-data', 'nyc-bus-tracker/data/snapshots/'],
                                         capture_output=True, text=True).stdout.replace('nyc-bus-tracker/data/snapshots/', '').replace('.jsonl', '').split())
          for k in range(14, 0, -1):
              d = (today - timedelta(days=k)).isoformat()
              f = f'nyc-bus-tracker/data/daily/{d}.json'
              current = os.path.exists(f) and json.load(open(f)).get('methodVersion') == 2
              if d in on_branch and (k == 1 or not current):
                  print(d)
          PY
          fi
          echo "Days to process:"; cat days.txt

      - name: Process
        run: |
          for D in $(cat days.txt); do
            rm -rf nyc-bus-tracker/data/snapshots && mkdir -p nyc-bus-tracker/data/snapshots
            git checkout origin/bus-data -- "nyc-bus-tracker/data/snapshots/${D}/" 2>/dev/null || true
            git checkout origin/bus-data -- "nyc-bus-tracker/data/snapshots/${D}.jsonl" 2>/dev/null || true
            git reset -q -- nyc-bus-tracker/data/snapshots/ 2>/dev/null || true
            node nyc-bus-tracker/collector/process.js "$D"
          done
          rm -rf nyc-bus-tracker/data/snapshots

      - name: Rebuild summaries, route files, events and downloads
        run: bash nyc-bus-tracker/scripts/rebuild.sh

      - name: Commit to main
        run: |
          git config user.name "Bus Tracker Bot"
          git config user.email "bus-bot@users.noreply.github.com"
          git add -A nyc-bus-tracker/data/daily/ nyc-bus-tracker/data/summary/ nyc-bus-tracker/data/route-history/ \
                     nyc-bus-tracker/data/events/ nyc-bus-tracker/data/downloads/
          git diff --staged --quiet && { echo "No changes"; exit 0; }
          git commit -q -m "Daily summary: $(paste -sd' ' days.txt)"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase -X theirs origin main
          done
          exit 1

      - name: Collection health
        run: |
          python3 - <<'PY'
          import json, sys
          h = json.load(open('nyc-bus-tracker/data/summary/health.json'))
          print(h['message'])
          if h['alert']:
              print(f"::error::{h['message']} Check the Collect Bus Data workflow.")
              sys.exit(1)
          PY
