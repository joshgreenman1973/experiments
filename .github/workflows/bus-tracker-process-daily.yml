name: Process Daily Summary

on:
  # Run daily at 5:00 AM UTC (midnight ET during EDT, 12am EST)
  schedule:
    - cron: '0 5 * * *'

  # Manual trigger with optional date override
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD), defaults to yesterday'
        required: false

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      # Snapshots live on the `bus-data` branch (isolated from main so collection
      # never collides with PR pushes). Daily summaries land on `main` because
      # GitHub Pages serves from there. Strategy: check out main as the base,
      # then pull just data/snapshots/ from bus-data into the working tree.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull the processed day's snapshots from bus-data
        run: |
          # Figure out which date we're processing (yesterday ET, or a manual
          # override), then pull ONLY that day's folder — not the whole multi-GB
          # archive. Checking out the entire snapshot tree grows monotonically
          # slower as the archive grows; we only ever read one day here.
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='America/New_York' date -d 'yesterday' '+%Y-%m-%d' 2>/dev/null || TZ='America/New_York' date -v-1d '+%Y-%m-%d')
          fi
          echo "PROCESS_DATE=$DATE" >> "$GITHUB_ENV"
          echo "Processing date: $DATE"

          # BLOBLESS fetch — download only commit + trees, not the ~5.8 GB of
          # historical blobs. The one day we process is lazily fetched by the
          # checkout below. Keeps this job fast as the archive grows.
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git fetch --filter=blob:none --no-tags origin bus-data --depth=1
          rm -rf nyc-bus-tracker/data/snapshots
          mkdir -p nyc-bus-tracker/data/snapshots
          # Current format: one folder of per-hour files for the date.
          git checkout origin/bus-data -- "nyc-bus-tracker/data/snapshots/${DATE}/" 2>/dev/null \
            && echo "Pulled ${DATE}/ folder." || echo "No ${DATE}/ folder on bus-data."
          # Legacy fallback: a single flat file, for dates before hourly chunking.
          git checkout origin/bus-data -- "nyc-bus-tracker/data/snapshots/${DATE}.jsonl" 2>/dev/null \
            && echo "Pulled legacy ${DATE}.jsonl." || true
          # `git checkout <ref> -- <path>` stages what it pulls; unstage so
          # snapshots are never committed to main (they live on bus-data).
          git reset -q -- nyc-bus-tracker/data/snapshots/ 2>/dev/null || true
          echo "Snapshot files now in working tree:"
          ls -R nyc-bus-tracker/data/snapshots/ | head -20

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd nyc-bus-tracker/collector && npm ci

      - name: Process the day's snapshots
        run: |
          echo "Processing $PROCESS_DATE"
          node nyc-bus-tracker/collector/process.js "$PROCESS_DATE"

      - name: Generate weekly/monthly rollups
        run: node nyc-bus-tracker/collector/rollup.js

      - name: Regenerate download CSVs
        run: node nyc-bus-tracker/scripts/export_csv.js

      - name: Commit summaries to main
        run: |
          git config user.name "Bus Tracker Bot"
          git config user.email "bus-bot@users.noreply.github.com"
          # Only stage the rollup outputs. Snapshots stay on bus-data — defensively
          # unstage them in case anything above re-staged the path.
          git add nyc-bus-tracker/data/daily/ nyc-bus-tracker/data/summary/ nyc-bus-tracker/data/downloads/
          git reset -q -- nyc-bus-tracker/data/snapshots/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No new summaries to commit"
            exit 0
          fi

          DATE=$(TZ='America/New_York' date '+%Y-%m-%d')
          git commit -m "Daily summary: ${DATE}"

          # Daily processor runs at 1am ET when main is usually quiet, but
          # retry once on rejection just in case a PR landed mid-processing.
          if ! git push origin main; then
            echo "Push rejected, rebasing and retrying..."
            git pull --rebase --autostash origin main
            git add nyc-bus-tracker/data/daily/ nyc-bus-tracker/data/summary/ nyc-bus-tracker/data/downloads/
            git push origin main
          fi
