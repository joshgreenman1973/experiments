name: Scan prediction markets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run fetch
        working-directory: nyc-prediction-markets
        run: node fetch.mjs

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nyc-prediction-markets/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update prediction-market data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push origin main; then pushed=true; break; fi
              echo "Push rejected (attempt $attempt) — rebasing on latest main…"
              git pull --rebase --autostash origin main
            done
            $pushed || { echo "Push failed after retries"; exit 1; }
          fi
