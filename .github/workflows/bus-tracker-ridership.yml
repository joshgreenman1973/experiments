name: Bus Tracker Route Ridership

on:
  # MTA publishes the stop-level ridership dataset monthly with ~1 month lag;
  # check on the 6th and 16th so a late drop is still caught within days.
  schedule:
    - cron: '30 10 6,16 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch per-route monthly ridership
        # Script FAILS LOUD (nonzero exit) on empty responses, truncated month
        # lists, sanity-floor violations, or month regression — a red run means
        # look at it, never a silently stale file.
        run: python3 nyc-bus-tracker/scripts/fetch_route_ridership.py

      - name: Commit if changed
        run: |
          git config user.name "bus-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nyc-bus-tracker/data/ridership/routes-monthly.json
          if git diff --cached --quiet; then
            echo "No new ridership month; nothing to commit."
            exit 0
          fi
          git commit -m "Bus tracker: refresh route ridership ($(date -u '+%Y-%m-%d'))"
          git push origin main
