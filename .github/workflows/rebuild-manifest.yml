name: Rebuild gallery manifest

# Runs the manifest builder whenever overrides change (admin saves) OR
# the builder script itself changes, plus a periodic sweep to pick up new
# Pages-enabled repos that weren't on the gallery yet.
#
# The sweep used to run hourly, which made this workflow the dominant source
# of pushes to main: 149 of roughly 200 commits in a representative week.
# The manifest tracks lastCommit and commitCount for every remote repo, so it
# genuinely changes almost every hour and the "commit if changed" guard below
# does not suppress much. Every one of those pushes triggers a Pages rebuild,
# and Pages deploys were queueing behind each other until the deploy step hit
# its ten-minute timeout. Four-hourly keeps new projects appearing the same
# day while cutting Pages rebuilds from this workflow by about 75%.
on:
  push:
    branches: [main]
    paths:
      - 'project-overrides.json'
      - 'scripts/build-manifest.mjs'
  schedule:
    - cron: '0 */4 * * *' # every four hours
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-gallery]

permissions:
  contents: write

concurrency:
  group: rebuild-manifest
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run builder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-manifest.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet projects-manifest.json; then
            echo "No manifest change — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects-manifest.json
          git commit -m "Rebuild manifest [skip ci]"
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push origin main; then pushed=true; break; fi
            echo "Push rejected (attempt $attempt) — rebasing on latest main…"
            git pull --rebase --autostash origin main
          done
          $pushed || { echo "Push failed after retries"; exit 1; }
