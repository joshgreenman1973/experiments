name: Monthly Family Dinner Price Check

on:
  schedule:
    # 1st of every month at 10am ET (2pm UTC)
    - cron: '0 14 1 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Re-price the two pinned dishes at every panel restaurant by deterministic
      # string match (no AI, no carry-forward). A restaurant counts only if all its
      # components re-price cleanly; a miss is excluded, and it is dropped after two
      # consecutive misses or a 404. Writes data/panel-snapshots/<date>.json and
      # persists misses/drops to data/panel.json.
      - name: Run panel re-check
        working-directory: family-dinner-prices
        run: node scripts/check-panel.js

      # Rebuild the dollar-bill series (avg/median/spread, by borough, matched-sample
      # month-over-month) -> panel-history.js
      - name: Rebuild panel history
        working-directory: family-dinner-prices
        run: node scripts/build-panel-history.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add family-dinner-prices/data/panel.json
          git add family-dinner-prices/data/panel-snapshots/
          git add family-dinner-prices/panel-history.js
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            MONTH=$(date +"%B %Y")
            git commit -m "Monthly panel re-check: ${MONTH}

            Auto-generated by monthly-price-check workflow (rigorous panel pipeline).
            Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>"
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push origin main; then pushed=true; break; fi
              echo "Push rejected (attempt $attempt) — rebasing on latest main…"
              git pull --rebase --autostash origin main
            done
            $pushed || { echo "Push failed after retries"; exit 1; }
          fi
