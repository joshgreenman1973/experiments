<!-- Subway vs. street, hour for hour — paste into a Ghost HTML card -->
<div class="vc-embed-subway-vs-street-crime" style="margin:1.5em 0;">
  <div class="vc-embed-subway-vs-street-crime__frame" style="position:relative;width:100%;border:1px solid #111;overflow:hidden;">
    <iframe
      class="vc-embed-subway-vs-street-crime__iframe"
      src="https://joshgreenman1973.github.io/experiments/subway-vs-street-crime/card.html?embed=1"
      title="Hour for hour, the street is riskier than the subway"
      loading="lazy"
      scrolling="no"
      style="display:block;width:100%;height:980px;border:0;background:transparent;"
    ></iframe>
  </div>

  <script>
    (function () {
      window.addEventListener('message', function (e) {
        var d = e && e.data;
        if (!d || d.type !== 'vc-embed-height' || d.id !== 'subway-vs-street-crime') return;
        var f = document.querySelector('.vc-embed-subway-vs-street-crime__iframe');
        if (f && typeof d.height === 'number') f.style.height = d.height + 'px';
      });
    })();
  </script>
</div>
