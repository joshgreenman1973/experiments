<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vital City data products</title>
<link rel="stylesheet" href="https://use.typekit.net/qqk2vto.css">
<style>
@font-face { font-family: "GascogneTS"; src: url("https://vital-city-nyc.github.io/vital-city-design-system/fonts/GascogneTS-Light.ttf") format("truetype"); font-weight: 200; font-display: swap; }
:root {
  --black: #050507; --white: #fff; --cloud: #dddddd; --cloud-20: #f2f2f2;
  --orange: #ff7c53; --orange-20: #fde5dd; --magenta: #e7466d; --magenta-20: #fadae2;
  --charcoal: #707175; --indigo: #394882; --chartreuse: #dde44c;
  --green: #57aa4a; --green-1: #bdd451;
  --sans: "halyard-text", "Halyard Text", Helvetica, Arial, sans-serif;
  --display: "halyard-display", "Halyard Display", var(--sans);
  --serif: "GascogneTS", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--white); color: var(--black); }
body { font-family: var(--sans); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }

/* gate */
#gate { min-height: 100vh; display: grid; place-items: center; background: var(--black); color: var(--white); padding: 24px; }
#gate form { width: min(420px, 100%); }
#gate h1 { font-family: var(--serif); font-weight: 200; font-size: 2.6rem; line-height: 1.05; margin: 0 0 .6rem; }
#gate p { color: #b9b9ba; margin: 0 0 1.4rem; }
#gate .row { display: flex; gap: 8px; }
#gate input { flex: 1; font: inherit; font-size: 1.05rem; padding: 12px 14px; border: 0; background: var(--white); color: var(--black); }
#gate button { font: inherit; font-weight: 700; padding: 12px 18px; border: 0; background: var(--orange); color: var(--black); cursor: pointer; }
#gate .err { color: var(--orange); min-height: 1.4em; margin-top: .6rem; font-size: .95rem; }

/* page */
#app[hidden], #gate[hidden] { display: none; }
header.top { background: var(--black); color: var(--white); padding: 40px 0 34px; }
header.top .kick { color: var(--chartreuse); font-weight: 700; font-size: .95rem; margin-bottom: .7rem; }
header.top h1 { font-family: var(--serif); font-weight: 200; font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1.02; margin: 0 0 1rem; max-width: 16ch; }
header.top .finding { font-size: 1.25rem; line-height: 1.4; max-width: 46rem; margin: 0 0 .7rem; }
header.top .finding b { color: var(--chartreuse); font-weight: 700; }
header.top .lede { color: #b9b9ba; max-width: 46rem; margin: 0; }

.controls { position: sticky; top: 0; z-index: 5; background: var(--white); border-bottom: 2px solid var(--black); }
.controls .wrap { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding-top: 12px; padding-bottom: 12px; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.group > span { font-weight: 700; font-size: .9rem; margin-right: 4px; }
.chip { font: inherit; font-size: .9rem; padding: 5px 10px; border: 1.5px solid var(--black); background: var(--white); color: var(--black); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--black); color: var(--white); }
select, input[type=search] { font: inherit; font-size: .9rem; padding: 5px 8px; border: 1.5px solid var(--black); background: var(--white); color: var(--black); }
input[type=search] { width: 200px; }
.count { margin-left: auto; font-size: .9rem; color: var(--charcoal); }

/* legend */
.legend { display: flex; flex-wrap: wrap; gap: 6px 26px; padding: 18px 0 4px; font-size: .9rem; color: var(--charcoal); }
.legend b { color: var(--black); }
.sw { display: inline-block; width: 11px; height: 11px; margin-right: 6px; vertical-align: -1px; }

/* list */
.list { padding: 10px 0 80px; }
.month { font-family: var(--display); font-weight: 700; font-size: 1.05rem; padding: 26px 0 8px; border-bottom: 1px solid var(--black); }
.item { display: grid; grid-template-columns: minmax(0, 44%) minmax(0, 1fr); gap: 28px; padding: 26px 0; border-bottom: 1px solid var(--cloud); }
.shot { display: block; aspect-ratio: 16 / 10; background: var(--cloud-20); border: 1px solid var(--cloud); overflow: hidden; }
.shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
.shot.none { display: grid; place-items: center; color: var(--charcoal); font-size: .9rem; text-align: center; padding: 20px; }
.topic { color: var(--orange); font-weight: 700; font-size: .92rem; margin-bottom: .25rem; }
.item h2 { font-family: var(--display); font-weight: 700; font-size: 1.55rem; line-height: 1.12; margin: 0 0 .55rem; }
.item h2 a { text-decoration: none; }
.item h2 a:hover { text-decoration: underline; text-decoration-thickness: 2px; }
.desc { margin: 0 0 1rem; max-width: 40rem; }
.item > * { min-width: 0; }
.desc, .facts dd, .method { overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: .93rem; margin: 0 0 .9rem; }
.facts dt { font-weight: 700; }
.facts dd { margin: 0; }
.fresh { display: inline-flex; gap: 2px; vertical-align: -1px; margin-right: 8px; }
.fresh i { width: 9px; height: 12px; background: var(--cloud); display: block; }
.muted { color: var(--charcoal); }
.method { padding: 10px 12px; font-size: .93rem; max-width: 40rem; border-left: 5px solid var(--cloud); background: var(--cloud-20); }
.method.serious { border-color: var(--magenta); background: var(--magenta-20); }
.method.minor { border-color: var(--orange); background: var(--orange-20); }
.method b { display: block; margin-bottom: 2px; }
.links { margin-top: .8rem; font-size: .9rem; color: var(--charcoal); word-break: break-all; }
.links a { color: var(--black); font-weight: 700; }
.empty { padding: 40px 0; color: var(--charcoal); }
footer { border-top: 2px solid var(--black); padding: 18px 0 40px; font-size: .9rem; color: var(--charcoal); }

@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  .item { grid-template-columns: 1fr; gap: 14px; }
  .count { margin-left: 0; width: 100%; }
  input[type=search] { width: 100%; }
  .controls { position: static; }
}
</style>
</head>
<body>
<div id="gate">
  <form id="gateForm" autocomplete="off">
    <h1>Data products</h1>
    <p>Internal list. Enter the password to open it.</p>
    <div class="row"><input id="pw" type="password" aria-label="Password" placeholder="Password" autofocus><button type="submit">Open</button></div>
    <div class="err" id="err"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top"><div class="wrap">
    <div class="kick">For internal review</div>
    <h1>Vital City data products</h1>
    <p class="finding" id="finding"></p>
    <p class="lede" id="lede"></p>
  </div></header>

  <div class="controls"><div class="wrap">
    <div class="group" role="group" aria-label="Method questions"><span>Method</span>
      <button class="chip" data-flag="all" aria-pressed="true">All</button>
      <button class="chip" data-flag="serious" aria-pressed="false">Serious questions</button>
      <button class="chip" data-flag="minor" aria-pressed="false">Minor</button>
      <button class="chip" data-flag="none" aria-pressed="false">None on file</button>
    </div>
    <div class="group"><span>Topic</span><select id="topic"><option value="">All topics</option></select></div>
    <div class="group"><span>Sort</span><select id="sort"><option value="recent">Most recent first</option><option value="topic">By topic</option><option value="flag">Serious questions first</option></select></div>
    <div class="group"><input id="q" type="search" placeholder="Search" aria-label="Search"></div>
    <div class="count" id="count"></div>
  </div></div>

  <div class="wrap">
    <div class="legend">
      <span><b>Freshness</b> bars count down from the last real update:
        <span class="fresh"><i style="background:var(--green)"></i><i style="background:var(--green)"></i><i style="background:var(--green)"></i><i style="background:var(--green)"></i></span>this week,
        <span class="fresh"><i style="background:var(--green-1)"></i><i style="background:var(--green-1)"></i><i style="background:var(--green-1)"></i><i></i></span>this month,
        <span class="fresh"><i style="background:var(--orange)"></i><i style="background:var(--orange)"></i><i></i><i></i></span>within three months,
        <span class="fresh"><i style="background:var(--charcoal)"></i><i></i><i></i><i></i></span>older.</span>
      <span><b>Method</b> <span class="sw" style="background:var(--magenta)"></span>serious open question <span class="sw" style="background:var(--orange);margin-left:10px"></span>minor caveats <span class="sw" style="background:var(--cloud);margin-left:10px"></span>none on file</span>
    </div>
    <div class="list" id="list"></div>
  </div>
  <footer><div class="wrap" id="foot"></div></footer>
</div>

<script>
const PAYLOAD = __PAYLOAD__;

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ciphertext));
  return JSON.parse(new TextDecoder().decode(pt));
}

document.getElementById('gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.textContent = 'Checking…';
  try {
    const data = await decrypt(pw);
    try { sessionStorage.setItem('vcp-pw', pw); } catch {}
    start(data);
  } catch { err.textContent = 'That password did not work.'; }
});
(async () => {
  let pw = null;
  try { pw = sessionStorage.getItem('vcp-pw'); } catch {}
  if (pw) { try { start(await decrypt(pw)); } catch {} }
})();

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtDate = iso => { const d = new Date(iso + 'T12:00:00'); return `${MONTHS[d.getMonth()].slice(0, 3)}. ${d.getDate()}, ${d.getFullYear()}`.replace('May.', 'May').replace('Jun.', 'June').replace('Jul.', 'July').replace('Sep.', 'Sept.'); };
const FLAG_ORDER = { serious: 0, minor: 1, none: 2 };

let DATA, state = { flag: 'all', topic: '', sort: 'recent', q: '' };

function ageDays(iso) { return iso ? Math.floor((DATA.builtAt - new Date(iso + 'T12:00:00').getTime()) / 864e5) : 9999; }
function agoText(n) {
  if (n >= 9999) return 'unknown';
  if (n <= 0) return 'today';
  if (n === 1) return 'yesterday';
  if (n < 14) return `${n} days ago`;
  if (n < 60) return `${Math.round(n / 7)} weeks ago`;
  return `${Math.round(n / 30.4)} months ago`;
}
function freshBars(n) {
  const [k, c] = n <= 7 ? [4, 'var(--green)'] : n <= 31 ? [3, 'var(--green-1)'] : n <= 92 ? [2, 'var(--orange)'] : [1, 'var(--charcoal)'];
  return '<span class="fresh" aria-hidden="true">' + [0, 1, 2, 3].map(i => `<i${i < k ? ` style="background:${c}"` : ''}></i>`).join('') + '</span>';
}

function start(data) {
  DATA = data;
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
  const items = DATA.items;
  const n = items.length;
  const month = items.filter(p => ageDays(p.lastUpdated) <= 31).length;
  const serious = items.filter(p => p.methodFlag === 'serious').length;
  const auto = items.filter(p => /^automatic/i.test(p.refresh || '')).length;
  document.getElementById('finding').innerHTML = `<b>${n}</b> data and infographic products built with Vital City in mind. <b>${month}</b> were updated in the past month, and <b>${serious}</b> have a serious methodological question still open.`;
  document.getElementById('lede').textContent = `${auto} refresh themselves on a schedule; the rest were built once or are updated by hand. Freshness is the date of the last real change to the content or data, not a cosmetic fix. Method notes come from the project files and working notes as of ${fmtDate(DATA.builtDate)}.`;
  const topics = [...new Set(items.map(p => p.topic))].sort();
  const sel = document.getElementById('topic');
  topics.forEach(t => sel.insertAdjacentHTML('beforeend', `<option>${esc(t)}</option>`));
  sel.onchange = () => { state.topic = sel.value; render(); };
  document.getElementById('sort').onchange = e => { state.sort = e.target.value; render(); };
  document.getElementById('q').oninput = e => { state.q = e.target.value.toLowerCase(); render(); };
  document.querySelectorAll('[data-flag]').forEach(b => b.onclick = () => {
    state.flag = b.dataset.flag;
    document.querySelectorAll('[data-flag]').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  });
  document.getElementById('foot').textContent = `Compiled ${fmtDate(DATA.builtDate)}. Screenshots taken the same day from the live pages. Internal; not for publication.`;
  render();
}

function card(p) {
  const n = ageDays(p.lastUpdated);
  const flag = p.methodFlag || 'none';
  const flagLabel = { serious: 'Serious open question', minor: 'Minor caveats', none: 'No open questions on file' }[flag];
  const shot = p.img
    ? `<a class="shot" href="${esc(p.url || '#')}" target="_blank" rel="noopener"><img loading="lazy" alt="Screenshot of ${esc(p.title)}" src="${p.img}"></a>`
    : `<div class="shot none">${esc(p.url ? 'No screenshot' : 'No live page')}</div>`;
  return `<article class="item">
    ${shot}
    <div>
      <div class="topic">${esc(p.topic)}</div>
      <h2>${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title)}</h2>
      <p class="desc">${esc(p.description)}</p>
      <dl class="facts">
        <dt>Updated</dt><dd>${freshBars(n)}${p.lastUpdated ? `${esc(fmtDate(p.lastUpdated))}, ${agoText(n)}` : 'unknown'}${p.lastUpdatedWhat ? ` <span class="muted">(${esc(p.lastUpdatedWhat)})</span>` : ''}</dd>
        <dt>Refresh</dt><dd>${esc(p.refresh || 'unknown')}</dd>
        ${p.dataThrough ? `<dt>Data through</dt><dd>${esc(p.dataThrough)}</dd>` : ''}
        ${p.vcStatus ? `<dt>Status</dt><dd>${esc(p.vcStatus)}</dd>` : ''}
      </dl>
      <div class="method ${flag}"><b>${flagLabel}</b>${esc(p.methodNotes || '')}</div>
      <div class="links">${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">Open</a> ${esc(p.url.replace(/^https?:\/\//, ''))}` : ''}</div>
    </div>
  </article>`;
}

function render() {
  let items = DATA.items.filter(p =>
    (state.flag === 'all' || (p.methodFlag || 'none') === state.flag) &&
    (!state.topic || p.topic === state.topic) &&
    (!state.q || [p.title, p.description, p.methodNotes, p.name].join(' ').toLowerCase().includes(state.q)));
  const byDate = (a, b) => (b.lastUpdated || '').localeCompare(a.lastUpdated || '');
  if (state.sort === 'topic') items.sort((a, b) => a.topic.localeCompare(b.topic) || byDate(a, b));
  else if (state.sort === 'flag') items.sort((a, b) => FLAG_ORDER[a.methodFlag || 'none'] - FLAG_ORDER[b.methodFlag || 'none'] || byDate(a, b));
  else items.sort(byDate);
  document.getElementById('count').textContent = `Showing ${items.length} of ${DATA.items.length}`;
  let html = '', last = null;
  for (const p of items) {
    let head = null;
    if (state.sort === 'recent') { const d = p.lastUpdated ? new Date(p.lastUpdated + 'T12:00:00') : null; head = d ? `${MONTHS[d.getMonth()]} ${d.getFullYear()}` : 'Date unknown'; }
    else if (state.sort === 'topic') head = p.topic;
    else head = { serious: 'Serious open questions', minor: 'Minor caveats', none: 'No open questions on file' }[p.methodFlag || 'none'];
    if (head !== last) { html += `<div class="month">${esc(head)}</div>`; last = head; }
    html += card(p);
  }
  document.getElementById('list').innerHTML = html || '<p class="empty">Nothing matches those filters.</p>';
}
</script>
</body>
</html>
