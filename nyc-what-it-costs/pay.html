<style>
:root{--accent:var(--mint)}

.wrap{max-width:1180px}

.sec+.sec{border-top:1px solid var(--line2)}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 44px;margin-top:12px}
