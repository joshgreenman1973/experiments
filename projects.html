<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>experiments — index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:        #f3efe6;
    --paper-2:      #ece7dc;
    --card:         #fbf8f1;
    --ink:          #1a1612;
    --ink-2:        #4a4137;
    --ink-3:        #8a8074;
    --ink-4:        #b8ae9f;
    --rule:         #d4cbb8;
    --rule-strong:  #1a1612;
    --accent:       #7a2b28;
    --accent-soft:  #c27169;
    --highlight:    #e8cfa3;
    --shadow-sm:    0 1px 0 rgba(26,22,18,0.04);
    --shadow-md:    0 2px 8px rgba(26,22,18,0.06), 0 12px 32px -8px rgba(26,22,18,0.08);
    --shadow-lg:    0 8px 40px -8px rgba(26,22,18,0.18);
  }
  [data-theme="ink"] {
    --paper:        #141110;
    --paper-2:      #1b1715;
    --card:         #1f1a17;
    --ink:          #f3efe6;
    --ink-2:        #c9c0b2;
    --ink-3:        #908678;
    --ink-4:        #57504a;
    --rule:         #322c26;
    --rule-strong:  #f3efe6;
    --accent:       #e09a7e;
    --accent-soft:  #bf6a4e;
    --highlight:    #3d2f1d;
    --shadow-sm:    0 1px 0 rgba(0,0,0,0.3);
    --shadow-md:    0 2px 8px rgba(0,0,0,0.3), 0 12px 32px -8px rgba(0,0,0,0.5);
    --shadow-lg:    0 8px 40px -8px rgba(0,0,0,0.7);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-size: 14px; line-height: 1.55;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "kern", "liga", "ss01";
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(26,22,18,0.035) 1px, transparent 0);
    background-size: 3px 3px;
  }
  [data-theme="ink"] body {
    background-image:
      radial-gradient(circle at 1px 1px, rgba(243,239,230,0.025) 1px, transparent 0);
  }

  ::selection { background: var(--accent); color: var(--paper); }

  /* ---- Masthead ---- */
  .theme-toggle {
    background: none; border: 1px solid var(--rule); color: var(--ink-2);
    width: 28px; height: 20px; border-radius: 10px; padding: 0;
    cursor: pointer; position: relative; font: inherit;
    transition: border-color 0.2s;
  }
  .theme-toggle::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--ink); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  [data-theme="ink"] .theme-toggle::after { transform: translateX(8px); }
  .theme-toggle:hover { border-color: var(--ink); }

  .masthead {
    padding: 28px 40px 20px;
    border-bottom: 1px solid var(--rule);
    position: relative;
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 24px; flex-wrap: wrap;
  }
  .masthead h1 {
    font-family: "Fraunces", serif;
    font-variation-settings: "opsz" 48, "SOFT" 30, "wght" 420;
    font-size: 36px;
    line-height: 1;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--ink);
  }
  .masthead .path {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink-3);
    margin-left: 2px;
  }
  .masthead .stats {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.04em;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .masthead .stats span { color: var(--ink); font-weight: 500; }

  /* ---- Controls ---- */
  .controls {
    padding: 20px 40px;
    display: grid;
    grid-template-columns: minmax(260px, 420px) 1fr auto;
    gap: 24px; align-items: center;
    border-bottom: 1px solid var(--rule);
    position: sticky; top: 0; z-index: 20;
    background: rgba(243,239,230,0.92);
    backdrop-filter: saturate(180%) blur(8px);
    -webkit-backdrop-filter: saturate(180%) blur(8px);
  }
  [data-theme="ink"] .controls { background: rgba(20,17,16,0.92); }

  .search {
    position: relative;
  }
  .search input {
    width: 100%;
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-size: 14px;
    padding: 6px 0 8px 24px;
    background: none;
    border: 0;
    border-bottom: 1px solid var(--rule);
    color: var(--ink);
    outline: none;
  }
  .search input::placeholder {
    color: var(--ink-4);
  }
  .search input:focus { border-bottom-color: var(--accent); }
  .search::before {
    content: "";
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px;
    background: currentColor;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'/><path d='m21 21-4.3-4.3'/></svg>") no-repeat center / contain;
    mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'/><path d='m21 21-4.3-4.3'/></svg>") no-repeat center / contain;
    color: var(--ink-3);
    pointer-events: none;
  }
  .search kbd {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    color: var(--ink-3); background: var(--paper-2);
    padding: 2px 6px; border-radius: 3px;
    border: 1px solid var(--rule);
  }

  .filter-groups { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  .filter-group { display: flex; align-items: center; gap: 8px; }
  .filter-group label {
    font-family: "JetBrains Mono", monospace;
    font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-3);
  }
  .filter-group select {
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    background: transparent;
    border: 0;
    border-bottom: 1px dotted var(--ink-3);
    color: var(--ink);
    padding: 2px 14px 2px 2px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' fill='none' stroke='currentColor' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='m3 5 3 3 3-3'/></svg>");
    background-repeat: no-repeat;
    background-position: right 0 center;
    background-size: 10px;
  }
  .filter-group select:hover { border-bottom-color: var(--accent); }
  .filter-group select:focus { outline: none; border-bottom-color: var(--accent); }

  .count {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.08em;
    color: var(--ink-3);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .count b { color: var(--ink); font-weight: 500; }

  /* ---- Grid ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 0;
    padding: 0 40px 80px;
    border-top: 1px solid transparent;
  }
  @media (min-width: 1400px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 1800px) {
    .grid { grid-template-columns: repeat(5, 1fr); }
  }

  .card {
    display: flex; flex-direction: column;
    padding: 28px 22px 24px;
    border-right: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
    position: relative;
    transition: background 0.25s ease;
    animation: reveal 0.5s cubic-bezier(0.25, 0.8, 0.3, 1) backwards;
  }
  .card:hover {
    background: var(--card);
  }
  .card:hover .thumb iframe,
  .card:hover .thumb .no-preview {
    filter: none;
  }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-3);
  }
  .card-head .idx { font-variant-numeric: tabular-nums; font-weight: 500; color: var(--ink); }
  .card-head .cat { }
  .card-head .cat .slash { color: var(--ink-4); margin: 0 4px; }

  .thumb {
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: var(--paper-2);
    position: relative;
    margin-bottom: 18px;
    border: 1px solid var(--rule);
    transition: border-color 0.25s ease;
  }
  .card:hover .thumb { border-color: var(--rule-strong); }
  .thumb iframe {
    border: 0;
    width: 300%; height: 300%;
    transform: scale(0.3333);
    transform-origin: 0 0;
    pointer-events: none;
    filter: saturate(0.88) contrast(0.95);
    transition: filter 0.25s ease;
  }
  .thumb .no-preview {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px;
    background:
      repeating-linear-gradient(135deg,
        transparent 0 12px,
        rgba(26,22,18,0.03) 12px 13px);
  }
  [data-theme="ink"] .thumb .no-preview {
    background:
      repeating-linear-gradient(135deg,
        transparent 0 12px,
        rgba(243,239,230,0.03) 12px 13px);
  }
  .no-preview .label {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--ink-3);
  }

  .card-title {
    font-family: "Fraunces", serif;
    font-variation-settings: "opsz" 32, "SOFT" 30, "wght" 420;
    font-size: 19px;
    line-height: 1.2;
    letter-spacing: -0.015em;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .card-desc {
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink-2);
    margin: 0 0 16px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .meta-rule {
    height: 1px;
    background: var(--rule);
    margin: 4px 0 12px;
  }
  .meta {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    color: var(--ink-3);
    margin-bottom: 16px;
    font-variant-numeric: tabular-nums;
  }
  .meta dt { letter-spacing: 0.08em; text-transform: uppercase; }
  .meta dd { margin: 0; color: var(--ink); font-weight: 500; }
  .meta dd .soft { color: var(--ink-3); font-weight: 400; }
  .meta dd.commit-msg {
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-size: 11.5px;
    color: var(--ink-2);
    font-weight: normal;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 100%;
  }

  .links {
    display: flex; flex-wrap: wrap; gap: 0 14px;
    margin-top: auto;
    padding-top: 4px;
  }
  .links a, .links button {
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink);
    text-decoration: none;
    padding: 4px 0;
    background: none;
    border: 0;
    border-bottom: 1px solid var(--rule-strong);
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
    position: relative;
  }
  .links a::after {
    content: " ↗";
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--ink-3);
    transition: transform 0.2s;
    display: inline-block;
  }
  .links a:hover, .links button:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
  .links a:hover::after { color: var(--accent); transform: translate(1px, -1px); }
  .links button.copied { color: var(--accent); border-color: var(--accent); }

  .card-head .cat { display: inline-flex; align-items: center; gap: 8px; }
  .flag {
    font-family: "JetBrains Mono", monospace;
    font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 1px 5px;
    border: 1px solid currentColor;
    color: var(--ink-3);
    line-height: 1.5;
  }
  .flag.nested { color: var(--accent); }
  .flag.loose { color: var(--accent-soft); }
  .flag.dropped { color: var(--ink-3); border-style: dashed; }

  /* Dropped projects — visibly de-emphasized */
  .card.dropped { opacity: 0.55; background: transparent; }
  .card.dropped:hover { opacity: 0.9; background: var(--card); }
  .card.dropped .card-title { text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: var(--ink-3); }
  .card.dropped .thumb { filter: grayscale(1) contrast(0.8); }

  .empty {
    grid-column: 1 / -1;
    padding: 80px 40px;
    text-align: center;
    font-size: 14px;
    color: var(--ink-3);
  }
  .empty small {
    display: block; margin-top: 8px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink-4);
  }

  /* ---- Footer ---- */
  footer {
    padding: 20px 40px 40px;
    border-top: 1px solid var(--rule);
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    color: var(--ink-3);
  }
  footer code {
    color: var(--ink);
  }
</style>
</head>
<body>

<header class="masthead">
  <div>
    <h1>experiments</h1>
    <div class="path">~/Experiments</div>
  </div>
  <div class="stats" id="stats">loading…</div>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"></button>
</header>

<section class="controls">
  <div class="search">
    <input type="search" id="q" placeholder="Search" autocomplete="off">
    <kbd>/</kbd>
  </div>
  <div class="filter-groups">
    <div class="filter-group">
      <label>Category</label>
      <select id="cat"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label>Account</label>
      <select id="owner"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label>Show</label>
      <select id="show">
        <option value="active">Active only</option>
        <option value="all">All including dropped</option>
        <option value="dropped">Dropped only</option>
        <option value="hasIndex">With preview</option>
        <option value="ownRepo">Own repo</option>
        <option value="loose">At root only</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Sort</label>
      <select id="sort">
        <option value="modified">Recent</option>
        <option value="name">A–Z</option>
        <option value="category">By category</option>
      </select>
    </div>
  </div>
  <div class="count" id="count"></div>
</section>

<main class="grid" id="grid"></main>

<footer>
  Rebuilds after every commit. Manual: <code>node scripts/build-manifest.mjs</code>
</footer>

<script>
let DATA = null;

const $ = (id) => document.getElementById(id);

function monthShort(d) {
  return d.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
}
async function load() {
  try {
    const res = await fetch('./projects-manifest.json?v=' + Date.now());
    DATA = await res.json();
  } catch (err) {
    $('grid').innerHTML = `<div class="empty">Could not load manifest.<small>run: node scripts/build-manifest.mjs — ${err.message}</small></div>`;
    return;
  }

  $('stats').innerHTML = `<span>${DATA.count}</span> projects · <span>${DATA.categories.length}</span> categories · built ${timeAgo(DATA.generatedAt)}`;

  for (const c of DATA.categories) {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    $('cat').appendChild(o);
  }
  for (const o of (DATA.owners || [])) {
    const el = document.createElement('option');
    el.value = o; el.textContent = o;
    $('owner').appendChild(el);
  }

  ['q','cat','sort','show','owner'].forEach(id => {
    $(id).addEventListener('input', render);
    $(id).addEventListener('change', render);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault(); $('q').focus(); $('q').select();
    }
    if (e.key === 'Escape' && document.activeElement === $('q')) {
      $('q').value = ''; render(); $('q').blur();
    }
  });

  $('themeToggle').addEventListener('click', () => {
    const current = document.documentElement.dataset.theme;
    const next = current === 'paper' ? 'ink' : 'paper';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('experiments-theme', next);
  });
  const saved = localStorage.getItem('experiments-theme');
  if (saved) document.documentElement.dataset.theme = saved;

  render();
}

function render() {
  const term = $('q').value.toLowerCase().trim();
  const cat = $('cat').value;
  const sort = $('sort').value;
  const show = $('show').value;
  const owner = $('owner').value;

  let list = DATA.projects.filter(p => {
    if (cat && p.category !== cat) return false;
    if (owner && p.githubOwner !== owner) return false;
    if (show === 'active' && p.status === 'dropped') return false;
    if (show === 'dropped' && p.status !== 'dropped') return false;
    if (show === 'hasIndex' && !p.previewUrl) return false;
    if (show === 'ownRepo' && !p.isNestedRepo) return false;
    if (show === 'loose' && p.category !== 'root') return false;
    if (!term) return true;
    const hay = [p.name, p.title, p.description, p.category, p.lastCommitMsg, p.gitRemote]
      .filter(Boolean).join(' ').toLowerCase();
    return hay.includes(term);
  });

  if (sort === 'name') list.sort((a,b) => a.name.localeCompare(b.name));
  else if (sort === 'category') list.sort((a,b) => (a.category + '/' + a.name).localeCompare(b.category + '/' + b.name));
  else list.sort((a,b) => (b.lastModified || '').localeCompare(a.lastModified || ''));

  $('count').innerHTML = `<b>${list.length}</b> of ${DATA.count}`;

  const grid = $('grid');
  grid.innerHTML = '';
  if (!list.length) {
    grid.innerHTML = '<div class="empty">No matches.<small>try clearing a filter</small></div>';
    return;
  }
  list.forEach((p, i) => grid.appendChild(card(p, i)));
  observeThumbnails();
}

function card(p, i) {
  const d = document.createElement('article');
  d.className = 'card' + (p.status === 'dropped' ? ' dropped' : '');
  d.style.animationDelay = `${Math.min(i * 20, 600)}ms`;

  const idx = String(i + 1).padStart(2, '0');
  const catDisplay = p.category === 'root' ? 'uncategorized' : p.category;

  const thumb = p.previewUrl
    ? `<div class="thumb" data-src="${encodeURI(p.previewUrl)}"></div>`
    : `<div class="thumb"><div class="no-preview"><span class="label">no preview</span></div></div>`;

  const commitMsg = p.lastCommitMsg
    ? `<dt>msg</dt><dd class="commit-msg" title="${escapeHtml(p.lastCommitMsg)}">${escapeHtml(p.lastCommitMsg)}</dd>`
    : '';
  const updated = p.lastCommit
    ? `<dt>upd</dt><dd>${timeAgo(p.lastCommit)} <span class="soft">· ${shortDate(p.lastCommit)}</span></dd>`
    : (p.lastModified ? `<dt>mod</dt><dd>${timeAgo(p.lastModified)}</dd>` : '');
  const ownerRow = p.githubOwner
    ? `<dt>gh</dt><dd>${escapeHtml(p.githubOwner)}${p.isNestedRepo ? ' <span class="soft">· own repo</span>' : ''}</dd>`
    : '';

  const links = [];
  if (p.indexUrl) links.push(`<a href="${encodeURI(p.indexUrl)}" target="_blank" rel="noopener">Open</a>`);
  if (p.livePagesUrl && p.livePagesUrl !== p.previewUrl) links.push(`<a href="${p.livePagesUrl}" target="_blank" rel="noopener">Live</a>`);
  if (p.github) links.push(`<a href="${p.github}" target="_blank" rel="noopener">GitHub</a>`);

  const flags = [];
  if (p.status === 'dropped') flags.push('<span class="flag dropped">dropped</span>');
  if (p.isNestedRepo) flags.push('<span class="flag nested">own·repo</span>');
  if (p.isLooseFile) flags.push('<span class="flag loose">loose</span>');

  d.innerHTML = `
    <div class="card-head">
      <span class="idx">${idx}</span>
      <span class="cat">${flags.join('')}${escapeHtml(catDisplay)}</span>
    </div>
    ${thumb}
    <h3 class="card-title">${escapeHtml(p.title)}</h3>
    ${p.description ? `<p class="card-desc">${escapeHtml(p.description)}</p>` : ''}
    <div class="meta-rule"></div>
    <dl class="meta">
      <dt>id</dt><dd>${escapeHtml(p.relPath)}</dd>
      ${ownerRow}
      ${updated}
      ${commitMsg}
    </dl>
    <div class="links">
      ${links.join('')}
      <button class="copy-path" data-path="${escapeHtml(p.localPath)}">Copy path</button>
    </div>`;

  d.querySelector('.copy-path').addEventListener('click', e => {
    navigator.clipboard.writeText(e.target.dataset.path).then(() => {
      const t = e.target.textContent;
      e.target.textContent = 'Copied';
      e.target.classList.add('copied');
      setTimeout(() => { e.target.textContent = t; e.target.classList.remove('copied'); }, 1200);
    });
  });
  return d;
}

const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    if (e.target.querySelector('iframe')) { io.unobserve(e.target); continue; }
    const src = e.target.dataset.src;
    if (src) {
      const f = document.createElement('iframe');
      f.src = src;
      f.loading = 'lazy';
      f.setAttribute('scrolling', 'no');
      f.setAttribute('tabindex', '-1');
      f.setAttribute('aria-hidden', 'true');
      e.target.appendChild(f);
    }
    io.unobserve(e.target);
  }
}, { rootMargin: '400px' });

function observeThumbnails() {
  document.querySelectorAll('.thumb[data-src]').forEach(t => {
    if (!t.querySelector('iframe')) io.observe(t);
  });
}

function timeAgo(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  if (s < 86400 * 14) return Math.floor(s/86400) + 'd ago';
  if (s < 86400 * 60) return Math.floor(s / (86400*7)) + 'w ago';
  if (s < 86400 * 365) return Math.floor(s / (86400*30)) + 'mo ago';
  return Math.floor(s / (86400*365)) + 'y ago';
}
function shortDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${monthShort(d).slice(0,3)} ${String(d.getDate()).padStart(2,'0')}`;
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

load();
