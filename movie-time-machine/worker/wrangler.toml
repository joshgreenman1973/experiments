name = "good-time-tmdb"
main = "src/index.js"
compatibility_date = "2026-01-01"

# One-time setup (run from this folder):
#   npx wrangler login                     # browser sign-in to Cloudflare
#   npx wrangler deploy                    # publishes good-time-tmdb.<subdomain>.workers.dev
#   npx wrangler secret put TMDB_API_KEY   # paste the TMDB key; stored encrypted
#
# Then set VITE_TMDB_PROXY in ../.env to the deployed URL and rebuild the site.
# After that the key exists only inside Cloudflare -- never in the published JS.
