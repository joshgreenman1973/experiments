<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved or missing</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-content: center;
    gap: 1.1rem;
    padding: 2rem;
    font: 400 17px/1.5 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
    background: #faf9f7;
    color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #14161a; color: #e8e6e3; }
  }
  p { margin: 0; max-width: 34rem; }
  .code {
    font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.55;
  }
  a { color: inherit; text-underline-offset: 3px; }
</style>
</head>
<body>
  <p class="code">404</p>
  <p id="msg">That page isn't here. Try the <a href="/experiments/projects.html">project gallery</a>.</p>

<script>
// Projects that moved out of this repo into their own repos keep their old
// URLs working from here. Pages has no server-side redirects, so this 404 page
// does the forwarding. Deliberately NOT a stub index.html inside the old
// folder: that is what let a stale copy shadow the live site and put the wrong
// card in the gallery.
var MOVED = {
  '/experiments/nyc-policy-calendar/': 'https://vitalcity-nyc.github.io/nyc-policy-calendar/'
};

var path = location.pathname.replace(/\/?$/, '/');
var dest = MOVED[path];
if (dest) {
  document.getElementById('msg').innerHTML =
    'This one moved. Sending you to <a href="' + dest + '">its new home</a>.';
  location.replace(dest + location.search + location.hash);
}
</script>
</body>
</html>
