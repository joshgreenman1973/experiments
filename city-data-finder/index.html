<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Data Finder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #1a1a1a;
      background: #f5f5f5;
      line-height: 1.55;
      font-size: 14px;
    }

    .container {
      max-width: 740px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    header {
      border-bottom: 2px solid #1a1a1a;
      padding-bottom: 12px;
      margin-bottom: 8px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    header p {
      color: #777;
      font-size: 13px;
      margin-top: 4px;
    }

    .date-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 8px;
    }

    .date-nav button {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
      color: #555;
      transition: border-color 0.15s;
    }

    .date-nav button:hover { border-color: #999; }
    .date-nav button:disabled { opacity: 0.3; cursor: default; }

    .date-label {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e8e8e8;
    }

    .filter-btn {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 5px 12px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 20px;
      cursor: pointer;
      color: #888;
      transition: all 0.15s;
    }

    .filter-btn:hover { color: #434343; border-color: #bbb; }

    .filter-btn.active {
      color: #fff;
      background: #c0392b;
      border-color: #c0392b;
    }

    .project-card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 10px;
      transition: border-color 0.15s;
    }

    .project-card:hover { border-color: #ccc; }

    .project-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 6px;
    }

    .project-title a {
      color: #1a1a1a;
      text-decoration: none;
    }

    .project-title a:hover { color: #c0392b; }

    .project-meta {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 3px;
      display: inline-block;
    }

    .tag-city {
      background: #e8f4fd;
      color: #2980b9;
    }

    .tag-category {
      background: #fdf2e8;
      color: #d35400;
    }

    .tag-source {
      background: #e8f8e8;
      color: #27ae60;
    }

    .project-desc {
      font-size: 13px;
      color: #444;
      margin-bottom: 6px;
    }

    .project-why {
      font-size: 12px;
      color: #888;
      font-style: italic;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
      font-size: 14px;
    }

    .empty-state p { margin-bottom: 8px; }

    .count {
      font-size: 12px;
      color: #999;
      margin-bottom: 16px;
    }

    @media (max-width: 600px) {
      .container { padding: 16px 14px 40px; }
      header h1 { font-size: 18px; }
      .project-card { padding: 14px 16px; }
      .filters { gap: 4px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>City Data Finder</h1>
      <p>Daily scan for interesting new data analysis and mapping projects about cities</p>
    </header>

    <div class="date-nav">
      <button id="prev-btn" onclick="navigate(-1)">&larr; Previous</button>
      <span class="date-label" id="date-label">Loading...</span>
      <button id="next-btn" onclick="navigate(1)">Next &rarr;</button>
    </div>

    <div class="filters" id="filters"></div>
    <div class="count" id="count"></div>
    <div id="projects"></div>
  </div>

  <script>
    let manifest = [];
    let currentIndex = 0;
    let currentData = null;
    let activeFilter = 'all';

    async function init() {
      try {
        const res = await fetch('data/manifest.json');
        manifest = await res.json();
        if (manifest.length === 0) {
          document.getElementById('date-label').textContent = 'No data yet';
          document.getElementById('projects').innerHTML =
            '<div class="empty-state"><p>No scans have run yet.</p><p>Data will appear here after the first daily scan.</p></div>';
          document.getElementById('prev-btn').disabled = true;
          document.getElementById('next-btn').disabled = true;
          return;
        }
        await loadDate(0);
      } catch (e) {
        document.getElementById('date-label').textContent = 'Error loading data';
      }
    }

    async function loadDate(index) {
      if (index < 0 || index >= manifest.length) return;
      currentIndex = index;
      const date = manifest[index];
      document.getElementById('date-label').textContent = formatDate(date);
      document.getElementById('prev-btn').disabled = index >= manifest.length - 1;
      document.getElementById('next-btn').disabled = index <= 0;

      try {
        const res = await fetch(`data/${date}.json`);
        currentData = await res.json();
        buildFilters();
        renderProjects();
      } catch (e) {
        document.getElementById('projects').innerHTML =
          '<div class="empty-state"><p>Could not load data for this date.</p></div>';
      }
    }

    function navigate(dir) {
      loadDate(currentIndex - dir);
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T12:00:00');
      return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    function buildFilters() {
      if (!currentData || !currentData.projects) return;
      const cities = new Set();
      const categories = new Set();
      currentData.projects.forEach(p => {
        if (p.city) cities.add(p.city);
        if (p.category) categories.add(p.category);
      });

      const container = document.getElementById('filters');
      container.innerHTML = '';

      const allBtn = makeFilterBtn('All', 'all');
      container.appendChild(allBtn);

      cities.forEach(c => container.appendChild(makeFilterBtn(c, 'city:' + c)));
      categories.forEach(c => container.appendChild(makeFilterBtn(c, 'cat:' + c)));
    }

    function makeFilterBtn(label, value) {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (activeFilter === value ? ' active' : '');
      btn.textContent = label;
      btn.onclick = () => {
        activeFilter = value;
        buildFilters();
        renderProjects();
      };
      return btn;
    }

    function renderProjects() {
      const container = document.getElementById('projects');
      if (!currentData || !currentData.projects || currentData.projects.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>No interesting projects found on this date.</p></div>';
        document.getElementById('count').textContent = '';
        return;
      }

      let projects = [...currentData.projects].sort((a, b) => {
        if (a.source === 'web' && b.source !== 'web') return -1;
        if (a.source !== 'web' && b.source === 'web') return 1;
        return 0;
      });
      if (activeFilter !== 'all') {
        if (activeFilter.startsWith('city:')) {
          projects = projects.filter(p => p.city === activeFilter.slice(5));
        } else if (activeFilter.startsWith('cat:')) {
          projects = projects.filter(p => p.category === activeFilter.slice(4));
        }
      }

      document.getElementById('count').textContent =
        projects.length + ' project' + (projects.length !== 1 ? 's' : '');

      container.innerHTML = projects.map(p => `
        <div class="project-card" data-city="${esc(p.city || '')}" data-category="${esc(p.category || '')}">
          <div class="project-title"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></div>
          <div class="project-meta">
            ${p.city ? `<span class="tag tag-city">${esc(p.city)}</span>` : ''}
            ${p.category ? `<span class="tag tag-category">${esc(p.category)}</span>` : ''}
            ${p.source ? `<span class="tag tag-source">${esc(p.source)}</span>` : ''}
          </div>
          <div class="project-desc">${esc(p.description || '')}</div>
          ${p.why_interesting ? `<div class="project-why">${esc(p.why_interesting)}</div>` : ''}
        </div>
      `).join('');
    }

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    init();
  </script>
</body>
</html>
