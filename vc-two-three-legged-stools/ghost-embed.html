<!-- Two- and three-legged stools — paste into a Ghost HTML card -->
<link rel="stylesheet" href="https://use.typekit.net/qqk2vto.css">
<style>
  .vc-stools{--vc-black:#050507;--vc-orange:#ff7c53;--vc-orange-80:#f69577;--vc-charcoal:#707175;--vc-charcoal-20:#e2e3e2;
    box-sizing:border-box;max-width:700px;margin:1.5em auto;background:#fff;border:2px solid var(--vc-black);padding:26px 28px 12px;
    font-family:"halyard-text","Inter","Helvetica Neue",Arial,sans-serif;color:var(--vc-black);font-weight:300;-webkit-font-smoothing:antialiased;}
  .vc-stools *{box-sizing:border-box;}
  .vc-stools h2.vc-stools-title{font-family:inherit;font-weight:900;font-size:1.5rem;line-height:1.15;margin:0 0 6px;letter-spacing:-0.01em;color:var(--vc-black);}
  .vc-stools p.vc-stools-dek{font-family:inherit;font-size:.95rem;font-weight:300;color:var(--vc-charcoal);margin:0 0 14px;line-height:1.35;}
  .vc-stools svg{display:block;width:100%;height:auto;font-family:inherit;}
  .vc-stools .leg{stroke:var(--vc-black);stroke-width:15;stroke-linecap:round;fill:none;}
  .vc-stools .seat-top{fill:var(--vc-orange);stroke:var(--vc-black);stroke-width:2;}
  .vc-stools .seat-side{fill:var(--vc-orange-80);stroke:var(--vc-black);stroke-width:2;}
  .vc-stools .seat-fill{fill:var(--vc-orange-80);}
  .vc-stools .seat-edge{stroke:var(--vc-black);stroke-width:2;}
  .vc-stools .seat-label{font-size:17px;font-weight:800;fill:var(--vc-black);text-anchor:middle;}
  .vc-stools .leg-label,.vc-stools .foot-label{font-size:13px;font-weight:700;fill:var(--vc-black);text-anchor:middle;}
  .vc-stools .stool-title{font-size:12px;font-weight:700;fill:var(--vc-charcoal);text-anchor:middle;letter-spacing:.06em;text-transform:uppercase;}
  .vc-stools .ground{stroke:var(--vc-charcoal-20);stroke-width:2;}
  @media (max-width:480px){.vc-stools{padding:18px 16px 14px;}.vc-stools h2.vc-stools-title{font-size:1.25rem;}}
</style>
<div class="vc-stools">
  <h2 class="vc-stools-title">Two- and three-legged stools</h2>
  <p class="vc-stools-dek">Two ways of thinking about what holds a survivor up, and what each model asks of them.</p>
  <svg viewBox="0 0 700 430" role="img" aria-label="Two- and three-legged stools: a two-legged stool with legs labeled Pathology and Post-traumatic growth, standing on Timeline and Demand/expectation; and a three-legged stool with legs labeled Normalizing/integrating grief, Mitigating trauma and Addressing injustice/challenge systems, standing on Equity and opportunity, Research and resource, and Partnership and policy.">
    <line class="ground" x1="20" y1="342" x2="680" y2="342"/>
    <text class="stool-title" x="180" y="22">Two legs</text>
    <line class="leg" x1="132" y1="86" x2="82" y2="330"/>
    <line class="leg" x1="228" y1="86" x2="278" y2="330"/>
    <ellipse class="seat-side" cx="180" cy="82" rx="90" ry="17"/>
    <rect class="seat-fill" x="90" y="66" width="180" height="16"/>
    <line class="seat-edge" x1="90" y1="66" x2="90" y2="82"/>
    <line class="seat-edge" x1="270" y1="66" x2="270" y2="82"/>
    <ellipse class="seat-top" cx="180" cy="66" rx="90" ry="17"/>
    <text class="seat-label" x="180" y="72">Survivor</text>
    <text class="leg-label" transform="translate(82 212) rotate(-78.4)">Pathology</text>
    <text class="leg-label" transform="translate(292 208) rotate(78.4)"><tspan x="0" dy="0">Post-traumatic</tspan><tspan x="0" dy="15">growth</tspan></text>
    <text class="foot-label" x="82" y="370">Timeline</text>
    <text class="foot-label" x="278" y="370"><tspan x="278" dy="0">Demand /</tspan><tspan x="278" dy="16">expectation</tspan></text>
    <text class="stool-title" x="515" y="22">Three legs</text>
    <line class="leg" x1="462" y1="86" x2="412" y2="330"/>
    <line class="leg" x1="515" y1="86" x2="515" y2="330"/>
    <line class="leg" x1="568" y1="86" x2="618" y2="330"/>
    <ellipse class="seat-side" cx="515" cy="82" rx="90" ry="17"/>
    <rect class="seat-fill" x="425" y="66" width="180" height="16"/>
    <line class="seat-edge" x1="425" y1="66" x2="425" y2="82"/>
    <line class="seat-edge" x1="605" y1="66" x2="605" y2="82"/>
    <ellipse class="seat-top" cx="515" cy="66" rx="90" ry="17"/>
    <text class="seat-label" x="515" y="72">Survivor</text>
    <text class="leg-label" transform="translate(396 210) rotate(-78.4)"><tspan x="0" dy="-7">Normalizing /</tspan><tspan x="0" dy="15">integrating grief</tspan></text>
    <text class="leg-label" transform="translate(491 212) rotate(-90)">Mitigating trauma</text>
    <text class="leg-label" transform="translate(638 208) rotate(78.4)"><tspan x="0" dy="-7">Addressing injustice /</tspan><tspan x="0" dy="15">challenge systems</tspan></text>
    <text class="foot-label" x="412" y="370"><tspan x="412" dy="0">Equity &amp;</tspan><tspan x="412" dy="16">opportunity</tspan></text>
    <text class="foot-label" x="515" y="370"><tspan x="515" dy="0">Research &amp;</tspan><tspan x="515" dy="16">resource</tspan></text>
    <text class="foot-label" x="618" y="370"><tspan x="618" dy="0">Partnership &amp;</tspan><tspan x="618" dy="16">policy</tspan></text>
  </svg>
</div>
